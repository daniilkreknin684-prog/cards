      --text: #e8edf7;
      --muted: #94a3b8;
      --card: #111a2e;
      --bg: #0a1120;
      --line: #22304d;

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {

  .logo {
    width: 120px; height: 120px;
    margin: 0 auto 16px;
    border-radius: 28px;
    background: #fff;
    color: var(--blue);
    display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .logo b { font-size: 22px; display: block; }
  .logo span { font-size: 10px; letter-spacing: 1.5px; color: var(--blue-dark); display: block; margin-top: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; }
  .sub { margin: 6px 0 0; opacity: .85; font-size: 15px; }
  main {
    max-width: 440px;
    margin: -48px auto 0;
    padding: 0 16px 32px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(15,23,42,.08);
  }
  .save {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: var(--blue);
    color: #fff;
    font-size: 17px; font-weight: 600;
    text-decoration: none;
  }
  .save:active { transform: scale(.98); }
  .list { margin-top: 12px; display: grid; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px;
    border-radius: 14px;
    background: var(--blue-soft);
    color: var(--text);
    text-decoration: none;
  }
  .item:active { transform: scale(.99); }
  .ico {
    flex: 0 0 40px; width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    display: grid; place-items: center;
  }
  .ico svg { width: 20px; height: 20px; }
  .txt { min-width: 0; }
  .txt b { display: block; font-size: 15px; font-weight: 600; }
  .txt small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { margin-left: auto; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
